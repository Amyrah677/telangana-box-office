name: Test Parse API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run Parse API test
        run: python parse_test.py
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
